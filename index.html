<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruSeaFish — We've Moved!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito Sans', sans-serif;
      background: #f0f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Background gradient ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(96,165,250,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 110%,  rgba(45,212,176,0.14) 0%, transparent 60%),
        linear-gradient(170deg, #e8f4ff 0%, #f0f9ff 40%, #e6f7f4 100%);
      z-index: 0;
    }

    /* ── Main content wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 40px 20px 160px; /* bottom padding for waves */
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Glass card ── */
    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      box-shadow:
        0 8px 40px rgba(30, 80, 160, 0.10),
        0 2px 8px  rgba(30, 80, 160, 0.06),
        inset 0 1px 0 rgba(255,255,255,0.9);
      max-width: 540px;
      width: 100%;
      padding: 52px 48px 44px;
      text-align: center;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: inline-block;
      margin-bottom: 28px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }

    .logo-wrap img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 22px;
      box-shadow:
        0 12px 36px rgba(30, 100, 200, 0.18),
        0 2px  8px  rgba(30, 100, 200, 0.10);
      display: block;
    }

    /* ── Rocket badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, rgba(96,165,250,0.15), rgba(45,212,176,0.15));
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #1e6ab0;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
    }

    /* ── Heading ── */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      color: #0b2d5e;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    /* ── Body text ── */
    .subtitle {
      font-size: 15.5px;
      color: #4a6a8a;
      line-height: 1.7;
      font-weight: 400;
      margin-bottom: 28px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Large logo above button ── */
    .logo-large-wrap {
      margin-bottom: 28px;
    }

    .logo-large-wrap img {
      width: 220px;
      max-width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow:
        0 10px 32px rgba(30, 100, 200, 0.15),
        0 2px 8px rgba(30, 100, 200, 0.08);
      display: block;
      margin: 0 auto;
    }

    /* ── CTA Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1a77d4 0%, #0daf9a 100%);
      color: #fff;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 100px;
      padding: 16px 38px;
      cursor: pointer;
      text-decoration: none;
      box-shadow:
        0 8px 28px rgba(26, 119, 212, 0.38),
        0 2px 8px  rgba(26, 119, 212, 0.20);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent);
      border-radius: inherit;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 14px 38px rgba(26, 119, 212, 0.45),
        0 4px 12px  rgba(26, 119, 212, 0.25);
      filter: brightness(1.08);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    .divider {
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, #60a5fa, #2dd4b0);
      margin: 32px auto 0;
      opacity: 0.5;
    }

    /* ── Footer ── */
    .footer-text {
      font-size: 13px;
      color: #6a90b5;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 20px;
      text-align: center;
    }

    /* ── Ocean waves ── */
    .waves-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      line-height: 0;
      z-index: 1;
      pointer-events: none;
    }

    .waves-container svg {
      display: block;
      width: 200%;
      height: 90px;
      animation: waveSlide 9s linear infinite;
    }

    .waves-container svg.wave2 {
      position: absolute;
      bottom: 0;
      left: 0;
      opacity: 0.4;
      animation: waveSlide 13s linear infinite reverse;
      width: 200%;
    }

    @keyframes waveSlide {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── Mobile tweaks ── */
    @media (max-width: 540px) {
      .card {
        padding: 40px 28px 36px;
        border-radius: 24px;
      }
      .logo-wrap img { width: 90px; height: 90px; border-radius: 18px; }
      .footer-text { bottom: 90px; }
    }
  </style>
</head>
<body>

  <!-- Main page -->
  <main class="page">
    <div class="card">

      <!-- Logo -->
      <div class="logo-wrap">
        <img
          src="https://drive.google.com/thumbnail?id=1Yky4_vaRsUxjokSnQCWxASgCHDN0QkgO&sz=w800"
          alt="TruSeaFish Logo"
          onerror="this.style.display='none'"
        />
      </div>

      <!-- Badge -->
      <div class="badge">🚀 We've Moved!</div>

      <!-- Heading -->
      <h1>Thank you for<br/>supporting us.</h1>

      <!-- Body -->
      <p class="subtitle">
        Our seafood ordering has now moved to our brand‑new website.
        To continue buying Ocean Fresh Seafood, please visit us at
      </p>

      <!-- Large logo above button -->
      <div class="logo-large-wrap">
        <img
          src="https://drive.google.com/thumbnail?id=1Yky4_vaRsUxjokSnQCWxASgCHDN0QkgO&sz=w800"
          alt="TruSeaFish"
          onerror="this.style.display='none'"
        />
      </div>

      <!-- CTA Button -->
      <a href="https://www.truseafish.com" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Visit TruSeaFish
      </a>

      <div class="divider"></div>
    </div>

    <!-- Footer -->
    <p class="footer-text">🐟 Fresh from the Ocean. Delivered with Care.</p>
  </main>

  <!-- Animated Ocean Waves -->
  <div class="waves-container">
    <!-- Wave 1 (primary) -->
    <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M0,40 C180,80 360,10 540,45 C720,80 900,10 1080,45 C1260,80 1350,30 1440,40 L1440,90 L1440,90 L0,90 Z
           M1440,40 C1620,50 1800,80 1980,45 C2160,10 2340,80 2520,45 C2700,10 2880,80 2880,40 L2880,90 L1440,90 Z"
        fill="rgba(96,165,250,0.18)"
      />
    </svg>
    <!-- Wave 2 (secondary, reversed) -->
    <svg class="wave2" viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M0,55 C200,20 400,75 600,50 C800,25 1000,70 1200,50 C1360,35 1400,60 1440,55 L1440,90 L0,90 Z
           M1440,55 C1640,70 1840,20 2040,50 C2240,80 2440,25 2640,50 C2840,75 2880,40 2880,55 L2880,90 L1440,90 Z"
        fill="rgba(45,212,176,0.13)"
      />
    </svg>
  </div>

</body>
</html>
